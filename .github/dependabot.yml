# Weekly pull requests that update dependencies and the pinned GitHub Actions.
# Each PR runs the full CI, so a breaking update is caught before it merges.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a brand-new release, so a compromised or
    # broken version is usually caught (and yanked) before it reaches you.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"   # cliff.toml skips these in the changelog
    groups:
      # One PR for all minor and patch bumps; major bumps get their own PRs.
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a brand-new release, so a compromised or
    # broken version is usually caught (and yanked) before it reaches you.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]

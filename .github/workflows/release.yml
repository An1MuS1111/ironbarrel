name: Release

# To release (example for 0.1.2):
#   1. Set `version = "0.1.2"` in Cargo.toml and run `cargo check` to update Cargo.lock.
#   2. git cliff --tag v0.1.2 -o CHANGELOG.md
#   3. git commit -am "chore(release): v0.1.2"
#   4. git tag v0.1.2 && git push origin master v0.1.2
# This workflow then checks the tag matches Cargo.toml, runs the tests, and
# creates the GitHub release with notes generated from your commits.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      # No build cache here on purpose: a release builds from a clean state.
      - name: Tag matches the version in Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo test --all-targets --locked
      - run: cargo test --doc --locked
      - run: cargo package --locked

  github-release:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff needs the full history and tags
          persist-credentials: false
      - name: Release notes from commits (git-cliff)
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md "${flags[@]}"

  publish-crate:
    # Off until you set the repository variable PUBLISH_TO_CRATES_IO to "true".
    # Uses crates.io trusted publishing (no long-lived token in the repo):
    #   1. Publish the first version by hand:  cargo publish
    #   2. crates.io > ironbarrel > Settings > Trusted Publishing > add GitHub:
    #      owner An1MuS1111, repo ironbarrel, workflow release.yml, environment crates-io
    #   3. GitHub > Settings > Environments > new environment "crates-io"
    #      (optionally require your approval before it runs).
    name: Publish to crates.io
    needs: verify
    if: vars.PUBLISH_TO_CRATES_IO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      id-token: write # exchange GitHub's OIDC token for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
